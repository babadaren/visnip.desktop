name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests (online translation ${{ matrix.online }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # OFF is the published offline-only build; ON keeps the optional
        # online modes compiling and tested.
        online: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/windows-build
        with:
          online-translation: ${{ matrix.online }}

      - name: Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 900 -V

      - name: Diagnose failed test suites
        if: failure()
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:/Windows/Fonts
        run: |
          # QtTest output does not reach the runner's pipes; write it to files.
          $failed = Get-Content build/Testing/Temporary/LastTestsFailed.log -ErrorAction SilentlyContinue
          foreach ($entry in $failed) {
            $exe = Join-Path build (($entry -split ':', 2)[1] + '.exe')
            if (-not (Test-Path $exe)) { continue }
            $log = Join-Path $env:RUNNER_TEMP 'qtest-full.txt'
            & $exe -o "$log,txt" | Out-Null
            Write-Host ("##### {0}: full run exit 0x{1:X8}" -f $exe, $LASTEXITCODE)
            if (Test-Path $log) { Get-Content $log | Where-Object { $_ -notmatch '^PASS ' } | ForEach-Object { Write-Host $_ } }
            $functions = & $exe -functions | ForEach-Object { $_.Trim() -replace '\(\)$', '' } | Where-Object { $_ }
            foreach ($function in $functions) {
              $one = Join-Path $env:RUNNER_TEMP 'qtest-one.txt'
              & $exe $function -o "$one,txt" | Out-Null
              if ($LASTEXITCODE -ne 0) {
                Write-Host ("=== {0} alone: exit 0x{1:X8}" -f $function, $LASTEXITCODE)
                if (Test-Path $one) { Get-Content $one | ForEach-Object { Write-Host $_ } }
              }
            }
          }

      - name: Smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath build\visnip.exe -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "visnip.exe --self-test failed with $($process.ExitCode)" }

      - name: Package with the release script (includes --self-test of the package)
        if: matrix.online == 'OFF'
        shell: pwsh
        run: ./scripts/package-release.ps1 -BuildDir build -OutDir dist -Version ci

      - name: In-app update replaces a packaged installation (end to end)
        if: matrix.online == 'OFF'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          VISNIP_APPLY_UPDATE_QUIET: '1'
        run: |
          $package = (Resolve-Path dist/Visnip-ci-windows-x64).Path
          $list = Get-Content (Join-Path $package 'package-files.txt')
          if ($list -notcontains 'visnip.exe' -or $list -notcontains 'package-files.txt') { throw 'package-files.txt is incomplete' }
          # A user folder with a space and Chinese characters, as on many PCs.
          $root = Join-Path $env:RUNNER_TEMP '更新 测试'
          $install = Join-Path $root 'install'; $staging = Join-Path $root 'staging'
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item -LiteralPath $package -Destination $install -Recurse
          Copy-Item -LiteralPath $package -Destination $staging -Recurse
          # Installed: one file the new package drops, plus a user log that must stay.
          'obsolete' | Set-Content -LiteralPath (Join-Path $install 'obsolete.dll')
          Add-Content -LiteralPath (Join-Path $install 'package-files.txt') -Value 'obsolete.dll'
          New-Item -ItemType Directory -Force (Join-Path $install 'logs') | Out-Null
          'user log' | Set-Content -LiteralPath (Join-Path $install 'logs/keep.txt')
          'new version marker' | Set-Content -LiteralPath (Join-Path $staging 'README.md')
          $applier = Start-Process -FilePath (Join-Path $staging 'visnip.exe') -Wait -PassThru -WindowStyle Hidden `
            -ArgumentList '--apply-update', '--target', "`"$install`"", '--wait-pid', '0'
          if ($applier.ExitCode -ne 0) { throw "apply-update exited with $($applier.ExitCode)" }
          if ((Get-Content -LiteralPath (Join-Path $install 'README.md') -Raw) -notmatch 'new version marker') { throw 'files were not replaced' }
          if (Test-Path -LiteralPath (Join-Path $install 'obsolete.dll')) { throw 'obsolete file was kept' }
          if (-not (Test-Path -LiteralPath (Join-Path $install 'logs/keep.txt'))) { throw 'user log was removed' }
          if (Test-Path -LiteralPath (Join-Path $install '.visnip-update-backup')) { throw 'backup folder left behind' }
          $check = Start-Process -FilePath (Join-Path $install 'visnip.exe') -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($check.ExitCode -ne 0) { throw "updated installation failed --self-test with $($check.ExitCode)" }
          Write-Host 'In-app update: replaced, removed obsolete file, kept logs, updated copy starts.'
